<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>REAL FINE - Khá Kén</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --gold:#d4b06a;
    --gold-light:#f6d28d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050b14;
    color:white;
    font-family:'Montserrat',sans-serif;
    overflow-x:hidden;
}

/* ===== NAVBAR ===== */

.navbar{

    position:fixed;

    top:0;
    left:0;

    width:100%;

    z-index:100;

    backdrop-filter:blur(14px);

    background:
    rgba(5,10,18,.45);

    border-bottom:
    1px solid rgba(255,255,255,.05);
}

.nav-inner{

    max-width:1200px;

    height:84px;

    margin:auto;

    display:flex;

    justify-content:space-between;
    align-items:center;

    padding:0 30px;
}

.logo{

    display:flex;
    align-items:center;
    gap:12px;
}

.logo img{

    width:36px;
}

.logo-text{

    font-family:'Cinzel',serif;

    color:var(--gold);

    font-size:28px;

    font-style:italic;
}

/* ===== MENU ===== */

.menu{

    display:flex;
    gap:55px;
}

.menu a{

    color:white;

    text-decoration:none;

    position:relative;

    font-size:16px;

    transition:.4s;

    cursor:pointer;
}

.menu a:hover{

    color:var(--gold-light);
}

.menu a.active{

    color:var(--gold-light);
}

.menu a.active::after{

    content:'';

    position:absolute;

    left:0;
    bottom:-14px;

    width:100%;
    height:2px;

    background:
    linear-gradient(
    to right,
    transparent,
    var(--gold),
    transparent);

    box-shadow:
    0 0 15px var(--gold);
}

/* ===== HERO ===== */

.hero{

    position:relative;

    min-height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;
}

/* ===== BACKGROUND ===== */

.hero::before{

    content:'';

    position:absolute;

    inset:0;

    background:
    url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop')
    center/cover no-repeat;

    opacity:.52;

    filter:
    brightness(.65)
    blur(1px);

    transform:scale(1.05);

    z-index:1;
}

/* ===== DARK OVERLAY ===== */

.hero::after{

    content:'';

    position:absolute;

    inset:0;

    background:
    linear-gradient(
    to bottom,

    rgba(5,10,18,.12) 0%,

    rgba(5,10,18,.42) 35%,

    rgba(5,10,18,.82) 75%,

    rgba(5,10,18,.98) 100%
    );

    z-index:2;
}

/* ===== BIG BUTTERFLY ===== */

.bg-butterfly{

    position:absolute;

    width:900px;
    height:900px;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-35%);

    background:
    url('https://cdn-icons-png.flaticon.com/512/826/826972.png')
    center/contain no-repeat;

    opacity:.05;

    filter:
    blur(2px);

    z-index:2;
}

/* ===== CONTENT ===== */

.hero-content{

    position:relative;

    z-index:5;

    width:100%;
    max-width:850px;

    text-align:center;

    padding:140px 20px 80px;
}

/* ===== GLOW ===== */

.butterfly-glow{

    position:absolute;

    top:80px;
    left:50%;

    transform:translateX(-50%);

    width:260px;
    height:260px;

    border-radius:50%;

    background:
    radial-gradient(
    circle,
    rgba(255,220,150,.22),
    rgba(255,220,150,.08),
    transparent 70%
    );

    filter:blur(35px);

    z-index:2;
}

/* ===== BUTTERFLY ===== */

.butterfly{

    width:full-content;

    position:relative;

    z-index:5;

    margin-bottom:8px;

    filter:
    drop-shadow(0 0 35px rgba(255,210,120,.35));

    animation:float 4s ease-in-out infinite;
}

@keyframes float{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-12px);
    }
}

/* ===== BRAND ===== */

.brand{

    font-family:'Cinzel',serif;

    font-size:72px;

    font-style:italic;

    color:transparent;

    background:
    linear-gradient(
    to bottom,
    #f6ddb0,
    #b8862d
    );

    -webkit-background-clip:text;

    text-shadow:
    0 0 25px rgba(212,176,106,.18);

    filter:
    drop-shadow(0 0 12px rgba(212,176,106,.25));

    margin-top:-10px;
}

/* ===== LINE ===== */

.line{

    width:100%;
    max-width:560px;

    height:1px;

    margin:26px auto;

    background:
    linear-gradient(
    to right,
    transparent,
    rgba(212,176,106,.45),
    transparent
    );

    position:relative;
}

.line::after{

    content:'✦';

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:var(--gold);

    background:#08101c;

    padding:0 12px;

    font-size:16px;
}

/* ===== REAL FINE ===== */

.main-title{

    font-family:'Cinzel',serif;

    font-size:68px;

    letter-spacing:4px;

    text-shadow:
    0 0 20px rgba(255,255,255,.08);
}

/* ===== SUB ===== */

.subtitle{

    margin-top:12px;

    letter-spacing:6px;

    color:#b5bbc4;

    font-size:16px;
}

/* ===== DESC ===== */

.desc{

    margin-top:36px;

    color:#d0d0d0;

    line-height:1.9;

    font-size:20px;

    font-weight:300;
}

/* ===== INPUT ===== */

.input-label{

    margin-top:40px;

    margin-bottom:14px;

    color:#bdbdbd;

    font-size:22px;
}

.input-box{

    width:100%;
    max-width:520px;

    margin:auto;

    position:relative;
}

.input-box input{

    width:100%;

    height:70px;

    border-radius:14px;

    border:
    1px solid rgba(212,176,106,.45);

    background:
    rgba(0,0,0,.28);

    outline:none;

    color:white;

    font-size:18px;

    padding:0 55px 0 22px;

    backdrop-filter:blur(10px);

    transition:.4s;
}

.input-box input:focus{

    border-color:var(--gold);

    box-shadow:
    0 0 20px rgba(212,176,106,.2);
}

.input-box input::placeholder{

    color:#777;
}

.feather{

    position:absolute;

    right:20px;
    top:50%;

    transform:translateY(-50%);

    color:var(--gold);

    font-size:22px;
}

/* ===== BUTTON ===== */

.start-btn{

    margin-top:24px;

    width:100%;
    max-width:520px;

    height:72px;

    border-radius:14px;

    border:
    1px solid rgba(212,176,106,.45);

    background:
    linear-gradient(
    to bottom,
    rgba(26,20,10,.7),
    rgba(0,0,0,.85));

    color:#e6c27a;

    letter-spacing:5px;

    font-size:18px;

    font-weight:600;

    cursor:pointer;

    transition:.4s;

    box-shadow:
    inset 0 0 15px rgba(255,255,255,.03),
    0 0 20px rgba(212,176,106,.1);
}

.start-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 0 35px rgba(212,176,106,.28);
}

/* ===== MOBILE ===== */

@media(max-width:768px){

    .menu{
        gap:20px;
    }

    .brand{
        font-size:52px;
    }

    .main-title{
        font-size:42px;
    }

    .subtitle{
        font-size:14px;
        letter-spacing:4px;
    }

    .desc{
        font-size:16px;
    }

    .butterfly{
        width:110px;
    }

    .bg-butterfly{
        width:600px;
        height:600px;
    }

    .input-label{
        font-size:18px;
    }

    .input-box input{
        height:60px;
        font-size:15px;
    }

    .start-btn{
        height:60px;
        font-size:15px;
        letter-spacing:3px;
    }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="nav-inner">

        <div class="logo">

            <img src="https://cdn-icons-png.flaticon.com/512/826/826972.png">

            <div class="logo-text">
                Phá Kén
            </div>

        </div>

        <div class="menu">

            <a class="active">
                Giới thiệu
            </a>

            <a>
                Hướng dẫn
            </a>

            <a>
                Về dự án
            </a>

            <a>
                Liên hệ
            </a>

        </div>

    </div>

</nav>

<!-- HERO -->
<section class="hero">

    <!-- BIG BG BUTTERFLY -->
    <div class="bg-butterfly"></div>

    <div class="hero-content">

        <!-- GLOW -->
        <div class="butterfly-glow"></div>

        <!-- SMALL BUTTERFLY -->
        <img class="butterfly" src="https://cdn-icons-png.flaticon.com/512/826/826972.png">

        <!-- BRAND -->
        <div class="brand">
            Phá Kén
        </div>

        <div class="line"></div>

        <!-- TITLE -->
        <div class="main-title">
            REAL FINE
        </div>

        <!-- SUBTITLE -->
        <div class="subtitle">
            ỔN THẬT KHÔNG?
        </div>

        <div class="line"></div>

        <!-- DESCRIPTION -->
        <div class="desc">

            Chào cậu, hãy để tâm hồn mình được "thở"
            <br>
            trong chiếc kén nhỏ này một chút.

        </div>

        <!-- INPUT -->
        <div class="input-label">
            Tên của cậu là...
        </div>

        <div class="input-box">

            <input
            type="text"
            placeholder="Nhập tên của bạn...">

            <div class="feather">
                ✦
            </div>

        </div>

        <!-- BUTTON -->
        <button class="start-btn">
            ✦ BẮT ĐẦU HÀNH TRÌNH ✦
        </button>

    </div>

</section>

</body>
</html>
